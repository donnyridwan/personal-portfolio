    <!-- Favicon: adaptive for Light Mode and Dark Mode -->
    <link id="favicon-light" rel="icon" type="image/png" href="./assets/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link id="favicon-dark" rel="icon" type="image/png" href="./assets/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link id="favicon-default" rel="icon" type="image/png" href="./assets/favicon-light.png" />
    <link rel="apple-touch-icon" href="./assets/favicon-light.png" />
    <script>
      (function() {
        var darkIcon = './assets/favicon-dark.png';
        var lightIcon = './assets/favicon-light.png';
        var matcher = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        function updateFavicon() {
          if (!matcher) return;
          var favicon = document.getElementById('favicon-default');
          if (favicon) {
            favicon.href = matcher.matches ? darkIcon : lightIcon;
          }
        }
        if (matcher) {
          if (matcher.addEventListener) {
            matcher.addEventListener('change', updateFavicon);
          } else if (matcher.addListener) {
            matcher.addListener(updateFavicon);
          }
          updateFavicon();
        }
      })();
    </script>
